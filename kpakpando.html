<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KpakPando Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .message-anim { animation: slideIn 0.2s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 backdrop-blur-md">
        <h1 class="font-black tracking-tighter text-xl bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
            KpakPando Chat
        </h1>
        <div id="connection-status" class="text-[10px] uppercase tracking-widest text-slate-500 font-bold flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-yellow-500" id="status-dot"></span>
            Connecting
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
        <div class="text-center text-slate-500 text-xs py-10">
            Welcome to the secure channel.
        </div>
    </main>

    <!-- Input Area -->
    <footer class="p-4 bg-slate-900/80 border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="message-input" 
                placeholder="Type a message..." 
                autocomplete="off"
                class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-sm"
            >
            <button 
                type="submit"
                class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-bold text-sm transition-all active:scale-95"
            >
                Send
            </button>
        </form>
    </footer>

    <script>
        const API_KEY = 'bGc6Jw.BLbp0Q:5OBVdgaXXKXy5ZmNSboWAFI5Hp9CCHx5EX510bKdAoc';
        let userIp = "Detecting...";
        let ably, channel, myClientId;

        // 1. Get User's Public IP first
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIp = data.ip;
                initAbly();
            } catch (e) {
                userIp = "Unknown-" + Math.floor(Math.random() * 1000);
                initAbly();
            }
        }

        // 2. Initialize Ably
        function initAbly() {
            myClientId = `User-${Math.floor(Math.random() * 10000)}`;
            ably = new Ably.Realtime({ key: API_KEY, clientId: myClientId });
            channel = ably.channels.get('global-chat');

            // Handle Connection Status
            ably.connection.on('connected', () => {
                document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-emerald-500';
                document.getElementById('connection-status').childNodes[2].textContent = 'Online';
                
                // Enter Presence (attach IP to metadata)
                channel.presence.enter({ ip: userIp });
            });

            // Listen for Messages
            channel.subscribe('message', (msg) => {
                addMessageToUI(msg.clientId, msg.data, msg.clientId === myClientId);
            });
        }

        // 3. UI Helpers
        function addMessageToUI(sender, text, isMe, isSystem = false) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} message-anim`;
            
            if (isSystem) {
                div.innerHTML = `<div class="bg-slate-800/50 text-slate-400 text-[11px] px-3 py-1 rounded-md mb-2 font-mono border border-slate-700/50 w-full">${text}</div>`;
            } else {
                div.innerHTML = `
                    <span class="text-[10px] text-slate-500 font-bold mb-1 ml-1">${sender}</span>
                    <div class="${isMe ? 'bg-blue-600' : 'bg-slate-700'} px-4 py-2 rounded-2xl max-w-[80%] text-sm shadow-lg">
                        ${text}
                    </div>
                `;
            }
            
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        async function handleCommandIP() {
            channel.presence.get((err, members) => {
                if (err) {
                    addMessageToUI('System', 'Error fetching presence data.', false, true);
                    return;
                }
                
                if (!members || members.length === 0) {
                    addMessageToUI('System', '<strong>ACTIVE NODES:</strong><br>No peers detected in presence set.', false, true);
                    return;
                }

                let response = "<strong>ACTIVE NODES:</strong><br>";
                members.forEach(member => {
                    const status = member.clientId === myClientId ? "(You)" : "";
                    const ipDisplay = (member.data && member.data.ip) ? member.data.ip : "Hidden/Unknown";
                    response += `• ${member.clientId}: <span class="text-emerald-400">${ipDisplay}</span> ${status}<br>`;
                });
                addMessageToUI('System', response, false, true);
            });
        }

        // 4. Event Listeners
        document.getElementById('chat-form').onsubmit = (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const val = input.value.trim();
            
            if (!val) return;

            if (val.toLowerCase() === '/ip') {
                handleCommandIP();
            } else {
                channel.publish('message', val);
            }
            
            input.value = '';
        };

        // Boot
        getIP();
    </script>
</body>
</html>
