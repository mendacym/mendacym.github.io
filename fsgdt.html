<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSGDT | Secure Chat</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-color: #ff4500; /* Red-Orange */
            --bg-dark: #0a0a0a;
            --card-dark: #161616;
        }

        body {
            background-color: var(--bg-dark);
            color: #e5e5e5;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .accent-border {
            border-top: 3px solid var(--accent-color);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .message-bubble {
            max-width: 80%;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .other-message {
            background-color: #262626;
            color: #e5e5e5;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color) !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-2xl h-[85vh] flex flex-col bg-[#161616] rounded-lg shadow-2xl overflow-hidden accent-border relative">
        
        <!-- Header -->
        <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-[#1a1a1a]">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">FSGDT <span class="text-[#ff4500]">Chat</span></h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest" id="status-indicator">Connecting...</p>
            </div>
            <div id="client-count" class="bg-gray-800 px-3 py-1 rounded-full text-xs text-gray-400">
                0 Online
            </div>
        </header>

        <!-- Messages Area -->
        <div id="chat-window" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 custom-scrollbar">
            <!-- Initial Status Message -->
            <div class="text-center text-gray-600 text-xs italic my-2">
                Messages are encrypted via Ably Pub/Sub
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-[#1a1a1a] border-t border-gray-800">
            <form id="chat-form" class="flex gap-2">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type your message..." 
                    class="flex-1 bg-black border border-gray-800 rounded-md px-4 py-2 text-sm transition-all focus:ring-1 focus:ring-[#ff4500]"
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    class="bg-[#ff4500] hover:bg-[#e63e00] text-white font-medium px-6 py-2 rounded-md transition-colors text-sm"
                >
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const API_KEY = "IHBPCg.hZwlFw:ANkYv-ZE0pT3A8qDyhNUVXxY5SoCOPXM_fO56fYhJx8";
        const CHANNEL_NAME = "fsgdt-main-room";
        
        // Generate a random username
        const userId = "User_" + Math.floor(Math.random() * 10000);

        // UI Elements
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const statusIndicator = document.getElementById('status-indicator');

        // Initialize Ably
        const ably = new Ably.Realtime({ key: API_KEY, clientId: userId });
        const channel = ably.channels.get(CHANNEL_NAME);

        // Connection Handling
        ably.connection.on('connected', () => {
            statusIndicator.innerText = "System: Online";
            statusIndicator.classList.remove('text-gray-500');
            statusIndicator.classList.add('text-green-500');
        });

        ably.connection.on('disconnected', () => {
            statusIndicator.innerText = "System: Disconnected";
            statusIndicator.classList.add('text-red-500');
        });

        // Receiving Messages
        channel.subscribe('message', (msg) => {
            const isMe = msg.clientId === userId;
            renderMessage(msg.data.text, msg.data.sender, isMe);
        });

        // Sending Messages
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            
            if (text) {
                channel.publish('message', {
                    text: text,
                    sender: userId
                });
                userInput.value = '';
            }
        });

        function renderMessage(text, sender, isMe) {
            const container = document.createElement('div');
            container.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'text-[10px] text-gray-500 mb-1 px-1';
            nameSpan.innerText = isMe ? 'You' : sender;

            const bubble = document.createElement('div');
            bubble.className = `message-bubble px-4 py-2 rounded-xl text-sm ${isMe ? 'user-message' : 'other-message'}`;
            bubble.innerText = text;

            container.appendChild(nameSpan);
            container.appendChild(bubble);
            chatWindow.appendChild(container);

            // Auto-scroll to bottom
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Presence Logic (Optional: Show online count)
        channel.presence.enter();
        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (!err) {
                    document.getElementById('client-count').innerText = `${members.length} Online`;
                }
            });
        });
    </script>
</body>
</html>
