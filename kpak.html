<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kpak</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .message-anim { animation: slideIn 0.2s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 1.25rem; font-size: 0.9rem; word-break: break-word; }
        .me { background: #2563eb; color: white; border-bottom-right-radius: 0.25rem; }
        .them { background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 0.25rem; }
        .system-msg { background: rgba(30, 41, 59, 0.5); color: #94a3b8; font-family: monospace; font-size: 11px; border: 1px solid rgba(51, 65, 85, 0.5); width: 100%; text-align: center; border-radius: 0.5rem; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 backdrop-blur-md">
        <div>
            <h1 class="font-black tracking-tighter text-xl bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                Kpak
            </h1>
            <div id="status" class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">Syncing...</div>
        </div>
        <div id="count" class="text-[10px] bg-slate-800 px-3 py-1 rounded-full text-slate-400 font-mono border border-slate-700">0 ONLINE</div>
    </header>

    <!-- Chat Area -->
    <main id="view" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar flex flex-col">
        <div class="text-center text-slate-500 text-xs py-10">
            Secure channel established.
        </div>
    </main>

    <!-- Input Area -->
    <footer class="p-4 bg-slate-900/80 border-t border-slate-800">
        <form id="gate" class="max-w-4xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="in" 
                placeholder="Type a message..." 
                autocomplete="off"
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-sm"
            >
            <button 
                type="submit"
                class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-bold text-sm transition-all active:scale-95"
            >
                Send
            </button>
        </form>
    </footer>

    <script>
        const KEY = "IHBPCg.hZwlFw:ANkYv-ZE0pT3A8qDyhNUVXxY5SoCOPXM_fO56fYhJx8";
        const UID = "ID_" + Math.random().toString(36).substring(7).toUpperCase();
        let userIp = "Detecting...";

        const ably = new Ably.Realtime({ key: KEY, clientId: UID });
        const chan = ably.channels.get("fsgdt-core", { params: { rewind: '50' } });

        const view = document.getElementById('view');
        const statusText = document.getElementById('status');
        const countDisplay = document.getElementById('count');
        const messageIds = new Set();

        async function fetchIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIp = data.ip;
                console.log("Local IP confirmed:", userIp);
            } catch (e) {
                userIp = "Hidden";
            }
        }

        function addLine(sender, body, type = 'chat', isMe = false) {
            const row = document.createElement('div');
            row.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} message-anim w-full`;
            
            if (type === 'system') {
                row.innerHTML = `<div class="system-msg p-2 my-1">${body}</div>`;
            } else {
                const meta = document.createElement('span');
                meta.className = 'text-[10px] text-slate-500 font-bold mb-1 ml-1 px-1';
                meta.innerText = isMe ? 'YOU' : sender;

                const b = document.createElement('div');
                b.className = `bubble ${isMe ? 'me' : 'them'} shadow-lg`;
                b.innerText = body;

                row.append(meta, b);
            }
            
            view.appendChild(row);
            view.scrollTop = view.scrollHeight;
        }

        ably.connection.on('connected', () => {
            statusText.innerText = "Active";
            statusText.style.color = "#10b981";
            chan.presence.enter();
        });

        ably.connection.on('disconnected', () => {
            statusText.innerText = "Reconnecting...";
            statusText.style.color = "#64748b";
        });

        chan.subscribe((m) => {
            const { name, data, clientId, id } = m;
            
            if (messageIds.has(id)) return;
            messageIds.add(id);

            if (name === 'msg') {
                addLine(data.user, data.body, 'chat', clientId === UID);
            } 
            else if (name === 'ip_req' && clientId !== UID) {
                // Someone requested IPs. Send mine back, but tag the requester as the target.
                chan.publish('ip_res', { ip: userIp, for: clientId });
            }
            else if (name === 'ip_res') {
                // Only display the response if I am the one who requested it.
                if (data.for === UID) {
                    addLine('System', `REPORT: ${clientId} // ADDR: ${data.ip}`, 'system');
                }
            }
        });

        document.getElementById('gate').onsubmit = (e) => {
            e.preventDefault();
            const input = document.getElementById('in');
            const val = input.value.trim();
            if (!val) return;

            if (val.toLowerCase() === '/ip') {
                addLine('System', 'Pinging active users for ADDR...', 'system');
                chan.publish('ip_req', {});
            } else {
                chan.publish('msg', { body: val, user: UID });
            }
            input.value = '';
        };

        setInterval(() => {
            chan.presence.get((err, members) => {
                if (!err) countDisplay.innerText = `${members.length} ONLINE`;
            });
        }, 3000);

        window.onload = fetchIP;
    </script>
</body>
</html>
